<head>

    <title>global ride companies</title>
    <style>
      * {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Keeps the background image with a dark gradient overlay */
            background: linear-gradient(cornsilk), 
                        url('images/bus.jpg') no-repeat center center fixed;
            background-size: cover;
            color: rgb(100, 91, 228);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        hr {
    height: 10px;
    background-color: rgb(6, 176, 243);
    
}

        .image {
            width: 90vw;
            height: 100vh;
            margin: 50px;

        }
        .image-container {
            position: relative;
            width: 100%;
        }
        .image-container img {
            width: 100%;
            display: block;
        }
        .text {
            position: absolute;
            top: 70%;
            left: 50%;
            bottom: 50%;
           
            transform: translate(-50%, -50%);
            color: #34c274;
            font-size: 40px;
            font-weight:normal;
            text-align: center;
            
        }
        
         /* Header & Navigation */
        header {
            background:rgb(115, 226, 230);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-container img {
            height: 55px;
            width: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #00d2ff;
        }

        .logo-container h1 {
            font-size: 1.1rem;
            line-height: 1.3;
            color: #fff;
        }

        .nav-menu ul {
            display: flex;
            list-style: none;
            gap: 5px;
            background: rgb(113, 109, 114);
            overflow: auto;
           
           
        }
        

        nav ul li a {
            color:#1d1b1b;
            text-decoration: none;
            font-weight: normal;
            transition: all 2s ease;
            display: block;
           
        }

        nav ul li a:hover {
            color:  #5e0be6;
            transform: translateY(-2px);
            
        }
         h1 {
            text-align: center;
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 50px;
            font-weight: bold;
            font-style: normal;
        }

        h1:hover {
            color: blue;
        }

       

/* Footer */
        footer {
            background:  rgb(115, 226, 230);
            color: rgb(12, 12, 12);
            text-align: left;
            padding: 1rem;
            margin-top: 40px;
            font-size: 0.9rem;
        }

    </style>
    
</head>
